<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DeskPet Remote</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --bubble-sent: #fee500;
      --bubble-sent-text: #191919;
      --bubble-recv: #334155;
      --bubble-recv-text: #f8fafc;
      --unread-color: #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
    
    .app-container {
      width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column;
      background: var(--card-bg); position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    /* 상단 헤더 */
    .header {
      padding: 14px 18px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
      display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .status-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; transition: background 0.3s; }
    .status-dot.connected { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    
    .header-right { display: flex; align-items: center; gap: 10px; }
    .pair-badge { font-size: 13px; font-weight: 700; color: var(--accent); }
    .noti-btn { background: none; border: none; font-size: 16px; cursor: pointer; padding: 2px; }
    .gear-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 2px; border-radius: 6px; }

    /* 알림 배너 */
    .noti-banner {
      background: #0284c7; color: #fff; padding: 10px 14px; font-size: 12px; font-weight: 600;
      display: none; justify-content: space-between; align-items: center;
    }
    .noti-banner button {
      background: #0f172a; color: #fff; border: none; padding: 4px 10px; border-radius: 6px;
      font-size: 11px; font-weight: 700; cursor: pointer;
    }

    /* 채팅 영역 */
    .chat-area {
      flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    }

    .msg-row.sent { display: flex; flex-direction: column; align-items: flex-end; }
    .msg-row.sent .msg-bubble-wrap { display: flex; align-items: flex-end; gap: 6px; }
    .msg-row.sent .msg-bubble {
      max-width: 260px; padding: 10px 14px; border-radius: 16px 4px 16px 16px;
      background: var(--bubble-sent); color: var(--bubble-sent-text); font-size: 14px; line-height: 1.4;
      word-break: break-all; font-weight: 500; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .msg-row.recv { display: flex; flex-direction: column; align-items: flex-start; }
    .msg-sender { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; margin-left: 2px; }
    .msg-row.recv .msg-bubble {
      max-width: 260px; padding: 10px 14px; border-radius: 4px 16px 16px 16px;
      background: var(--bubble-recv); color: var(--bubble-recv-text); font-size: 14px; line-height: 1.4;
      word-break: break-all; font-weight: 500; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .unread-badge { color: var(--unread-color); font-size: 11px; font-weight: 800; line-height: 1; margin-bottom: 3px; }
    .msg-bubble.action { background: #334155 !important; color: #f1f5f9 !important; border-radius: 14px !important; font-size: 13px !important; }

    /* 하단 컨트롤 */
    .bottom-controls {
      padding: 12px 14px; background: rgba(15, 23, 42, 0.95); border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; flex-direction: column; gap: 10px;
    }
    .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .action-btn {
      background: #334155; border: 1px solid rgba(255,255,255,0.05); color: #f8fafc;
      padding: 8px 4px; border-radius: 10px; font-size: 11px; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.15s;
    }
    .action-btn:active { transform: scale(0.95); background: #475569; }
    .action-btn span { font-size: 16px; }

    .input-row { display: flex; gap: 8px; }
    .msg-input {
      flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid #334155;
      background: #0f172a; color: #fff; font-size: 14px; outline: none;
    }
    .msg-input:focus { border-color: var(--accent); }
    .send-btn {
      background: var(--accent); border: none; color: #0f172a; font-weight: 700;
      padding: 0 16px; border-radius: 12px; cursor: pointer; font-size: 14px;
    }

    /* 모달 & 잠금 오버레이 */
    .modal-overlay {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(8px);
      display: flex; justify-content: center; align-items: center; z-index: 100;
    }
    .modal-card {
      width: 86%; max-width: 350px; background: #1e293b; border-radius: 20px; padding: 24px;
      display: flex; flex-direction: column; gap: 14px; border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .modal-title { font-size: 17px; font-weight: 700; color: #fff; text-align: center; }
    .modal-desc { font-size: 12px; color: var(--text-muted); text-align: center; line-height: 1.4; }
    
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .field-input {
      padding: 12px 14px; border-radius: 10px; border: 1px solid #334155; background: #0f172a;
      color: #fff; font-size: 14px; outline: none;
    }
    .field-input:focus { border-color: var(--accent); }
    .field-input.uppercase { text-transform: uppercase; font-weight: 600; }

    .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
    .toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0; background-color: #334155;
      transition: .3s; border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); }

    .modal-btn {
      background: var(--accent); border: none; color: #0f172a; font-weight: 800;
      padding: 13px; border-radius: 10px; cursor: pointer; font-size: 14px; margin-top: 6px;
    }
    .modal-btn:active { opacity: 0.85; }

    .link-btn {
      background: none; border: none; color: #94a3b8; font-size: 12px; text-decoration: underline;
      cursor: pointer; text-align: center; margin-top: 4px;
    }

    .shake { animation: shakeAnim 0.3s ease-in-out; }
    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 상단 헤더 -->
  <div class="header">
    <div class="status-badge">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">확인 중...</span>
    </div>
    <div class="header-right">
      <span id="pairNames" class="pair-badge">DeskPet</span>
      <button class="noti-btn" id="notiBtn" onclick="requestNotificationPermission()" title="알림 권한">🔔</button>
      <button class="gear-btn" onclick="openSettings()">⚙️</button>
    </div>
  </div>

  <!-- 알림 권한 유도 배너 -->
  <div id="notiBanner" class="noti-banner">
    <span>상단 팝업 알림을 켜두시겠어요?</span>
    <button onclick="requestNotificationPermission()">알림 켜기</button>
  </div>

  <!-- 채팅 영역 -->
  <div id="chatArea" class="chat-area"></div>

  <!-- 하단 컨트롤 -->
  <div class="bottom-controls">
    <div class="btn-grid">
      <button class="action-btn" onclick="sendAction('#CMD:HEART')"><span>❤️</span>하트</button>
      <button class="action-btn" onclick="sendAction('#CMD:TICKLE')"><span>👉</span>간질이기</button>
      <button class="action-btn" onclick="sendAction('#CMD:KNOCK')"><span>🔔</span>긴급호출</button>
      <button class="action-btn" onclick="sendAction('#CMD:RESET_FACE')"><span>🔄</span>내 표정리셋</button>
    </div>
    <div class="input-row">
      <input type="text" id="msgInput" class="msg-input" placeholder="메시지 입력 (한글/영어)..." onkeydown="if(event.key==='Enter') sendText()">
      <button class="send-btn" onclick="sendText()">전송</button>
    </div>
  </div>

  <!-- 1. 앱 진입 잠금 화면 -->
  <div id="lockModal" class="modal-overlay" style="display: none;">
    <div class="modal-card" id="lockCard">
      <div class="modal-title">🔒 DeskPet 보안 잠금</div>
      <div class="modal-desc">접속 비밀번호를 입력해주세요.</div>
      <div class="field-group">
        <input type="password" id="inputLockPw" class="field-input" placeholder="비밀번호" style="text-align: center; font-size: 18px; letter-spacing: 4px;" onkeydown="if(event.key==='Enter') verifyLockPassword()">
      </div>
      <button class="modal-btn" onclick="verifyLockPassword()">잠금 해제</button>
      <button class="link-btn" onclick="openForgotModal()">비밀번호를 잊으셨나요?</button>
    </div>
  </div>

  <!-- 2. 비밀번호 분실 복구 모달 -->
  <div id="forgotModal" class="modal-overlay" style="display: none;">
    <div class="modal-card" id="forgotCard">
      <div class="modal-title">🔑 암호 분실 복구</div>
      <div class="modal-desc">기기에 설정된 <b>커플 연결 코드</b>를 입력하여 인증하세요.</div>
      <div class="field-group">
        <input type="text" id="inputVerifyPairCode" class="field-input uppercase" placeholder="예: CP-7K2M9X" style="text-align: center;">
      </div>
      <button class="modal-btn" onclick="verifyRecoveryPairCode()">인증 및 암호 초기화</button>
      <button class="link-btn" onclick="closeForgotModal()">취소</button>
    </div>
  </div>

  <!-- 3. 설정 모달 -->
  <div id="settingsModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-title">커플 채널 & 보안 설정</div>
      
      <div class="field-group">
        <label class="field-label">커플 연결 코드</label>
        <input type="text" id="inputPairCode" class="field-input uppercase" placeholder="예: CP-7K2M9X">
      </div>

      <div class="field-group">
        <label class="field-label">내 닉네임 (영문)</label>
        <input type="text" id="inputMyName" class="field-input uppercase" placeholder="예: PARK">
      </div>
      <div class="field-group">
        <label class="field-label">상대방 닉네임 (영문)</label>
        <input type="text" id="inputTargetName" class="field-input uppercase" placeholder="예: CHOI">
      </div>

      <div class="toggle-row">
        <span class="field-label" style="margin:0;">접속 시 암호 잠금 사용</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggleUsePw" onchange="togglePwFieldState()">
          <span class="slider"></span>
        </label>
      </div>

      <div class="field-group" id="pwFieldWrap">
        <label class="field-label">접속 비밀번호 설정</label>
        <input type="password" id="inputNewAppPw" class="field-input" placeholder="비밀번호 입력">
      </div>

      <button class="modal-btn" onclick="saveSettings()">저장 및 재접속</button>
      <button class="modal-btn" style="background: #e11d48; color: #fff; margin-top: 0;" onclick="manualLock()">🔒 지금 즉시 잠그기</button>
      <button class="modal-btn" style="background: #334155; color: #fff; margin-top: 0;" onclick="closeSettings()">닫기</button>
    </div>
  </div>
</div>

<script>
  let pairCode   = localStorage.getItem("deskpet_pair_code") || "";
  let myName     = localStorage.getItem("deskpet_my_name") || "PARK";
  let targetName = localStorage.getItem("deskpet_target_name") || "CHOI";
  
  let usePw      = localStorage.getItem("deskpet_use_pw") !== "false"; 
  let appPw      = localStorage.getItem("deskpet_app_pw") || "1234";

  // ★ 새로고침 시 로그인 유지 플래그 (세션 동안 유지)
  let sessionUnlocked = sessionStorage.getItem("deskpet_unlocked") === "true";
  let isUnlocked = false;

  let client = null;
  let chatHistory = JSON.parse(localStorage.getItem("deskpet_chat_history") || "[]");
  let swRegistration = null;

  // ---------------- [안드로이드 전용 서비스 워커 인라인 등록] ----------------
  function initServiceWorker() {
    if ('serviceWorker' in navigator) {
      // 별도 sw.js 파일 없이 가상 서비스 워커 블롭 등록 (안드로이드 푸시 호환)
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => clients.claim());
        self.addEventListener('notificationclick', e => {
          e.notification.close();
          e.waitUntil(
            clients.matchAll({ type: 'window', includeUncontrolled: true }).then(clientList => {
              for (const client of clientList) {
                if ('focus' in client) return client.focus();
              }
              if (clients.openWindow) return clients.openWindow('/');
            })
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);

      navigator.serviceWorker.register(swUrl)
        .then(reg => {
          swRegistration = reg;
        })
        .catch(err => {
          console.log("SW Reg Fail:", err);
        });
    }
  }

  // ---------------- [알림 권한 및 발송 엔진] ----------------
  function checkNotificationStatus() {
    if (!("Notification" in window)) {
      document.getElementById("notiBtn").style.display = "none";
      return;
    }
    if (Notification.permission === "default") {
      document.getElementById("notiBanner").style.display = "flex";
    } else {
      document.getElementById("notiBanner").style.display = "none";
    }
  }

  function requestNotificationPermission() {
    if (!("Notification" in window)) {
      alert("이 브라우저는 웹 알림을 지원하지 않습니다.");
      return;
    }
    Notification.requestPermission().then(permission => {
      checkNotificationStatus();
      if (permission === "granted") {
        notifyIncomingMessage("🐾 DeskPet", "상단 배너 알림이 활성화되었습니다!", true);
      }
    });
  }

  function notifyIncomingMessage(sender, text, isAction = false) {
    // 1. 모바일 진동 실행
    if ("vibrate" in navigator) {
      try { navigator.vibrate([200, 100, 200]); } catch(e) {}
    }

    // 2. 알림 권한 없으면 중단
    if (!("Notification" in window) || Notification.permission !== "granted") return;

    let title = sender;
    let bodyText = text;
    if (isAction) {
      title = "🐾 DeskPet 인터랙션";
      bodyText = text;
    }

    const options = {
      body: bodyText,
      icon: "https://cdn-icons-png.flaticon.com/512/616/616430.png",
      badge: "https://cdn-icons-png.flaticon.com/512/616/616430.png",
      vibrate: [200, 100, 200],
      tag: "deskpet-alert",
      renotify: true
    };

    // 안드로이드 크롬 표준: ServiceWorkerRegistration.showNotification 호출
    if (swRegistration && swRegistration.showNotification) {
      swRegistration.showNotification(title, options);
    } else if (navigator.serviceWorker && navigator.serviceWorker.ready) {
      navigator.serviceWorker.ready.then(reg => {
        reg.showNotification(title, options);
      });
    } else {
      try { new Notification(title, options); } catch(e) {}
    }
  }

  // ---------------- [새로고침 유지 보안 로직] ----------------
  function checkEntrySecurity() {
    initServiceWorker();
    checkNotificationStatus();

    // 암호 미사용 설정이거나, 이미 이번 세션에서 한 번 풀었던 경우 -> 즉시 진입!
    if (!usePw || sessionUnlocked) {
      isUnlocked = true;
      document.getElementById("lockModal").style.display = "none";
      updatePairHeader();
      connectMQTT();
    } else {
      // 진짜로 잠긴 상태
      document.getElementById("lockModal").style.display = "flex";
      setTimeout(() => { document.getElementById("inputLockPw").focus(); }, 150);
    }
  }

  function verifyLockPassword() {
    const input = document.getElementById("inputLockPw");
    const entered = input.value.trim();

    if (entered === appPw) {
      isUnlocked = true;
      sessionStorage.setItem("deskpet_unlocked", "true"); // ★ 새로고침해도 유지되도록 기록
      document.getElementById("lockModal").style.display = "none";
      updatePairHeader();
      connectMQTT();
      requestNotificationPermission();
    } else {
      const card = document.getElementById("lockCard");
      card.classList.add("shake");
      input.value = "";
      input.placeholder = "비밀번호 불일치!";
      setTimeout(() => card.classList.remove("shake"), 300);
    }
  }

  function manualLock() {
    sessionStorage.removeItem("deskpet_unlocked");
    isUnlocked = false;
    closeSettings();
    document.getElementById("lockModal").style.display = "flex";
  }

  function openForgotModal() {
    document.getElementById("lockModal").style.display = "none";
    document.getElementById("forgotModal").style.display = "flex";
    document.getElementById("inputVerifyPairCode").value = "";
  }

  function closeForgotModal() {
    document.getElementById("forgotModal").style.display = "none";
    document.getElementById("lockModal").style.display = "flex";
  }

  function verifyRecoveryPairCode() {
    const entered = document.getElementById("inputVerifyPairCode").value.trim().toUpperCase();
    if (!entered) { alert("커플 연결 코드를 입력하세요."); return; }

    if (entered === pairCode && pairCode.length > 0) {
      alert("커플 코드 인증 성공!\n접속 암호가 초기화(1234)되었습니다.");
      appPw = "1234";
      localStorage.setItem("deskpet_app_pw", appPw);
      sessionStorage.setItem("deskpet_unlocked", "true");
      
      document.getElementById("forgotModal").style.display = "none";
      isUnlocked = true;
      updatePairHeader();
      connectMQTT();
      openSettings();
    } else {
      const card = document.getElementById("forgotCard");
      card.classList.add("shake");
      alert("등록된 커플 연결 코드와 일치하지 않습니다.");
      setTimeout(() => card.classList.remove("shake"), 300);
    }
  }

  function togglePwFieldState() {
    const enabled = document.getElementById("toggleUsePw").checked;
    document.getElementById("pwFieldWrap").style.display = enabled ? "flex" : "none";
  }

  function updatePairHeader() {
    if (!pairCode) {
      document.getElementById("pairNames").innerText = "코드 미설정";
    } else {
      document.getElementById("pairNames").innerText = `${pairCode} | ${myName} ➜ ${targetName}`;
    }
  }

  // ---------------- [MQTT 통신 엔진] ----------------
  function connectMQTT() {
    if (!isUnlocked) return;
    updatePairHeader();

    if (!pairCode) {
      document.getElementById("statusDot").classList.remove("connected");
      document.getElementById("statusText").innerText = "코드 필요";
      return;
    }

    const clientId = "WebRemote-" + pairCode + "-" + myName + "-" + Math.random().toString(16).substring(2, 8);
    client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "/mqtt", clientId);

    client.onConnectionLost = () => {
      document.getElementById("statusDot").classList.remove("connected");
      document.getElementById("statusText").innerText = "연결 끊김";
      setTimeout(connectMQTT, 3000);
    };

    client.onMessageArrived = (message) => {
      const payload = message.payloadString;

      // 1. 수신 확인 ACK
      if (payload.startsWith("#ACK:")) {
        const ackId = payload.substring(5).trim();
        const found = chatHistory.find(m => m.id === ackId && m.sender === 'me');
        if (found) {
          found.read = true;
          saveAndRenderChat();
        }
        return;
      }

      // 2. 상대방 인터랙션 수신
      if (payload.startsWith("#CMD:")) {
        let label = "명령 수신";
        if (payload === "#CMD:HEART") label = "❤️ " + targetName + "님이 하트를 보냈습니다!";
        if (payload === "#CMD:TICKLE") label = "👉 " + targetName + "님이 간질였습니다!";
        if (payload === "#CMD:KNOCK") label = "🔔 " + targetName + "님의 긴급 호출!";
        if (payload === "#CMD:RESET_FACE") return;

        chatHistory.push({ id: "cmd_" + Date.now(), text: label, sender: 'other', isAction: true, time: Date.now() });
        saveAndRenderChat();

        // 스마트폰 상단 배너 알림 트리거
        notifyIncomingMessage(targetName, label, true);
        return;
      }

      // 3. 상대방 일반 텍스트 메시지 수신
      let cleanMsg = payload;
      let msgId = "m_" + Date.now();

      if (payload.startsWith("#ID:")) {
        const secondHash = payload.indexOf('#', 4);
        if (secondHash != -1) {
          msgId = payload.substring(4, secondHash);
          cleanMsg = payload.substring(secondHash + 1);
        }
      }

      const exists = chatHistory.some(m => m.id === msgId);
      if (!exists) {
        chatHistory.push({
          id: msgId,
          text: cleanMsg,
          sender: 'other',
          time: Date.now()
        });
        if (chatHistory.length > 30) chatHistory.shift();
        saveAndRenderChat();

        // 스마트폰 상단 배너 알림 & 진동
        notifyIncomingMessage(targetName, cleanMsg, false);
      }
    };

    client.connect({
      useSSL: true,
      timeout: 5,
      keepAliveInterval: 20,
      onSuccess: () => {
        document.getElementById("statusDot").classList.add("connected");
        document.getElementById("statusText").innerText = "연결됨";
        const mySubTopic = `deskpet_2026/${pairCode}/dev_${myName}`;
        client.subscribe(mySubTopic);
      },
      onFailure: () => {
        document.getElementById("statusDot").classList.remove("connected");
        document.getElementById("statusText").innerText = "재연결 중...";
        setTimeout(connectMQTT, 3000);
      }
    });
  }

  function sendText() {
    if (!isUnlocked) return;
    if (!pairCode) { alert("우측 상단 ⚙️를 눌러 커플 코드를 먼저 설정해 주세요."); return; }
    const input = document.getElementById("msgInput");
    const text = input.value.trim();
    if (!text || !client || !client.isConnected()) return;

    const msgId = "m_" + Date.now();
    const payload = `#ID:${msgId}#${text}`;
    const pubTopic = `deskpet_2026/${pairCode}/dev_${targetName}`;

    const message = new Paho.MQTT.Message(payload);
    message.destinationName = pubTopic;
    client.send(message);

    chatHistory.push({ id: msgId, text: text, sender: 'me', read: false, time: Date.now() });
    if (chatHistory.length > 30) chatHistory.shift();
    saveAndRenderChat();
    input.value = "";
  }

  function sendAction(cmd) {
    if (!isUnlocked) return;
    if (!pairCode) { alert("우측 상단 ⚙️를 눌러 커플 코드를 먼저 설정해 주세요."); return; }
    if (!client || !client.isConnected()) return;

    const destination = (cmd === "#CMD:RESET_FACE") ? myName : targetName;
    const pubTopic = `deskpet_2026/${pairCode}/dev_${destination}`;

    const message = new Paho.MQTT.Message(cmd);
    message.destinationName = pubTopic;
    client.send(message);

    let label = "명령 전송";
    if (cmd === "#CMD:HEART") label = "❤️ 하트를 보냈습니다";
    if (cmd === "#CMD:TICKLE") label = "👉 간질이기를 보냈습니다";
    if (cmd === "#CMD:KNOCK") label = "🔔 긴급 호출을 보냈습니다";
    if (cmd === "#CMD:RESET_FACE") label = "🔄 내 표정을 초기화했습니다";

    chatHistory.push({ id: "cmd_" + Date.now(), text: label, sender: 'me', isAction: true, read: true, time: Date.now() });
    saveAndRenderChat();
  }

  function saveAndRenderChat() {
    localStorage.setItem("deskpet_chat_history", JSON.stringify(chatHistory));
    const area = document.getElementById("chatArea");
    area.innerHTML = "";

    chatHistory.forEach(m => {
      const row = document.createElement("div");

      if (m.sender === 'me') {
        row.className = "msg-row sent";
        const wrap = document.createElement("div");
        wrap.className = "msg-bubble-wrap";

        if (!m.isAction && !m.read) {
          const badge = document.createElement("span");
          badge.className = "unread-badge";
          badge.innerText = "1";
          wrap.appendChild(badge);
        }

        const bubble = document.createElement("div");
        bubble.className = "msg-bubble" + (m.isAction ? " action" : "");
        bubble.innerText = m.text;
        wrap.appendChild(bubble);

        row.appendChild(wrap);
      } else {
        row.className = "msg-row recv";
        
        if (!m.isAction) {
          const senderLabel = document.createElement("span");
          senderLabel.className = "msg-sender";
          senderLabel.innerText = targetName;
          row.appendChild(senderLabel);
        }

        const bubble = document.createElement("div");
        bubble.className = "msg-bubble" + (m.isAction ? " action" : "");
        bubble.innerText = m.text;
        row.appendChild(bubble);
      }

      area.appendChild(row);
    });

    area.scrollTop = area.scrollHeight;
  }

  function openSettings() {
    if (!isUnlocked) return;
    document.getElementById("inputPairCode").value = pairCode;
    document.getElementById("inputMyName").value = myName;
    document.getElementById("inputTargetName").value = targetName;
    document.getElementById("toggleUsePw").checked = usePw;
    document.getElementById("inputNewAppPw").value = appPw;
    togglePwFieldState();
    document.getElementById("settingsModal").style.display = "flex";
  }

  function closeSettings() {
    document.getElementById("settingsModal").style.display = "none";
  }

  function saveSettings() {
    const newPair   = document.getElementById("inputPairCode").value.trim().toUpperCase();
    const newMy     = document.getElementById("inputMyName").value.trim().toUpperCase();
    const newTarget = document.getElementById("inputTargetName").value.trim().toUpperCase();
    const newUsePw  = document.getElementById("toggleUsePw").checked;
    const newPw     = document.getElementById("inputNewAppPw").value.trim();

    if (!newPair || !newMy || !newTarget) {
      alert("연결 코드와 닉네임을 모두 입력해 주세요.");
      return;
    }
    if (newUsePw && !newPw) {
      alert("사용할 접속 비밀번호를 입력해 주세요.");
      return;
    }

    pairCode   = newPair;
    myName     = newMy;
    targetName = newTarget;
    usePw      = newUsePw;
    if (newUsePw) appPw = newPw;

    localStorage.setItem("deskpet_pair_code", pairCode);
    localStorage.setItem("deskpet_my_name", myName);
    localStorage.setItem("deskpet_target_name", targetName);
    localStorage.setItem("deskpet_use_pw", usePw ? "true" : "false");
    localStorage.setItem("deskpet_app_pw", appPw);

    closeSettings();
    if (client) client.disconnect();
    connectMQTT();
  }

  saveAndRenderChat();
  checkEntrySecurity();
</script>
</body>
</html>
