<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DeskPet Remote</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --bubble-sent: #fee500;
      --bubble-text: #191919;
      --unread-color: #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
    
    .app-container {
      width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column;
      background: var(--card-bg); position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .header {
      padding: 14px 18px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
      display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .status-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; transition: background 0.3s; }
    .status-dot.connected { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    
    .pair-badge { font-size: 13px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 6px; }
    .gear-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px; border-radius: 6px; }

    .chat-area {
      flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    }
    .msg-row { display: flex; flex-direction: column; align-items: flex-end; }
    .msg-bubble-wrap { display: flex; align-items: flex-end; gap: 6px; }
    
    .unread-badge {
      color: var(--unread-color); font-size: 11px; font-weight: 800; line-height: 1; margin-bottom: 3px;
    }
    .msg-bubble {
      max-width: 260px; padding: 10px 14px; border-radius: 16px 4px 16px 16px;
      background: var(--bubble-sent); color: var(--bubble-text); font-size: 14px; line-height: 1.4;
      word-break: break-all; font-weight: 500; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .msg-bubble.action {
      background: #334155; color: #f1f5f9; border-radius: 14px; font-size: 13px;
    }

    .bottom-controls {
      padding: 12px 14px; background: rgba(15, 23, 42, 0.95); border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; flex-direction: column; gap: 10px;
    }

    .btn-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    }
    .action-btn {
      background: #334155; border: 1px solid rgba(255,255,255,0.05); color: #f8fafc;
      padding: 8px 4px; border-radius: 10px; font-size: 11px; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.15s;
    }
    .action-btn:active { transform: scale(0.95); background: #475569; }
    .action-btn span { font-size: 16px; }

    .input-row { display: flex; gap: 8px; }
    .msg-input {
      flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid #334155;
      background: #0f172a; color: #fff; font-size: 14px; outline: none;
    }
    .msg-input:focus { border-color: var(--accent); }
    .send-btn {
      background: var(--accent); border: none; color: #0f172a; font-weight: 700;
      padding: 0 16px; border-radius: 12px; cursor: pointer; font-size: 14px;
    }

    /* 설정 모달 */
    .modal-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      display: none; justify-content: center; align-items: center; z-index: 100;
    }
    .modal-card {
      width: 86%; max-width: 340px; background: #1e293b; border-radius: 18px; padding: 22px;
      display: flex; flex-direction: column; gap: 14px; border: 1px solid rgba(255,255,255,0.1);
    }
    .modal-title { font-size: 16px; font-weight: 700; color: #fff; text-align: center; }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .field-input {
      padding: 10px 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a;
      color: #fff; font-size: 14px; text-transform: uppercase; font-weight: 600;
    }
    .field-hint { font-size: 11px; color: #64748b; line-height: 1.3; margin-top: -2px; }

    .modal-save-btn {
      background: var(--accent); border: none; color: #0f172a; font-weight: 700;
      padding: 12px; border-radius: 10px; cursor: pointer; font-size: 14px; margin-top: 6px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="status-badge">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">연결 중...</span>
    </div>
    <div class="pair-badge">
      <span id="pairNames">미설정</span>
      <button class="gear-btn" onclick="openSettings()">⚙️</button>
    </div>
  </div>

  <div id="chatArea" class="chat-area"></div>

  <div class="bottom-controls">
    <div class="btn-grid">
      <button class="action-btn" onclick="sendAction('#CMD:HEART')"><span>❤️</span>하트</button>
      <button class="action-btn" onclick="sendAction('#CMD:TICKLE')"><span>👉</span>간질이기</button>
      <button class="action-btn" onclick="sendAction('#CMD:KNOCK')"><span>🔔</span>긴급호출</button>
      <button class="action-btn" onclick="sendAction('#CMD:RESET_FACE')"><span>🔄</span>내 표정리셋</button>
    </div>
    <div class="input-row">
      <input type="text" id="msgInput" class="msg-input" placeholder="메시지 입력 (한글/영어)..." onkeydown="if(event.key==='Enter') sendText()">
      <button class="send-btn" onclick="sendText()">전송</button>
    </div>
  </div>

  <!-- 설정 모달 -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title">커플 채널 페어링 설정</div>
      
      <div class="field-group">
        <label class="field-label">커플 연결 코드</label>
        <input type="text" id="inputPairCode" class="field-input" placeholder="예: CP-7K2M9X">
        <p class="field-hint">※ 기기 초기 Wi-Fi 설정 포털에서 발급받은 코드를 입력하세요.</p>
      </div>

      <div class="field-group">
        <label class="field-label">내 닉네임 (영문)</label>
        <input type="text" id="inputMyName" class="field-input" placeholder="예: PARK">
      </div>
      <div class="field-group">
        <label class="field-label">상대방 닉네임 (영문)</label>
        <input type="text" id="inputTargetName" class="field-input" placeholder="예: CHOI">
      </div>

      <button class="modal-save-btn" onclick="saveSettings()">저장 및 재접속</button>
    </div>
  </div>
</div>

<script>
  let pairCode   = localStorage.getItem("deskpet_pair_code") || "";
  let myName     = localStorage.getItem("deskpet_my_name") || "PARK";
  let targetName = localStorage.getItem("deskpet_target_name") || "CHOI";

  let client = null;
  let sentMessages = JSON.parse(localStorage.getItem("deskpet_chat_history") || "[]");

  function updatePairHeader() {
    if (!pairCode) {
      document.getElementById("pairNames").innerText = "코드 미설정 (⚙️ 터치)";
    } else {
      document.getElementById("pairNames").innerText = `${pairCode} | ${myName} ➜ ${targetName}`;
    }
  }

  function connectMQTT() {
    updatePairHeader();
    if (!pairCode) {
      document.getElementById("statusDot").classList.remove("connected");
      document.getElementById("statusText").innerText = "코드 필요";
      return;
    }

    const clientId = "WebRemote-" + pairCode + "-" + myName + "-" + Math.random().toString(16).substring(2, 8);
    client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "/mqtt", clientId);

    client.onConnectionLost = () => {
      document.getElementById("statusDot").classList.remove("connected");
      document.getElementById("statusText").innerText = "연결 끊김";
      setTimeout(connectMQTT, 3000);
    };

    client.onMessageArrived = (message) => {
      const payload = message.payloadString;
      if (payload.startsWith("#ACK:")) {
        const ackId = payload.substring(5).trim();
        const found = sentMessages.find(m => m.id === ackId);
        if (found) {
          found.read = true;
          saveAndRenderChat();
        }
      }
    };

    client.connect({
      useSSL: true,
      timeout: 5,
      keepAliveInterval: 20,
      onSuccess: () => {
        document.getElementById("statusDot").classList.add("connected");
        document.getElementById("statusText").innerText = "연결됨";
        const mySubTopic = `deskpet_2026/${pairCode}/dev_${myName}`;
        client.subscribe(mySubTopic);
      },
      onFailure: () => {
        document.getElementById("statusDot").classList.remove("connected");
        document.getElementById("statusText").innerText = "재연결 중...";
        setTimeout(connectMQTT, 3000);
      }
    });
  }

  function sendText() {
    if (!pairCode) { alert("우측 상단 ⚙️를 눌러 기기 포털에서 생성된 커플 코드를 먼저 입력해 주세요."); return; }
    const input = document.getElementById("msgInput");
    const text = input.value.trim();
    if (!text || !client || !client.isConnected()) return;

    const msgId = "m_" + Date.now();
    const payload = `#ID:${msgId}#${text}`;
    const pubTopic = `deskpet_2026/${pairCode}/dev_${targetName}`;

    const message = new Paho.MQTT.Message(payload);
    message.destinationName = pubTopic;
    client.send(message);

    sentMessages.push({ id: msgId, text: text, read: false, time: Date.now() });
    if (sentMessages.length > 20) sentMessages.shift();
    saveAndRenderChat();
    input.value = "";
  }

  function sendAction(cmd) {
    if (!pairCode) { alert("우측 상단 ⚙️를 눌러 기기 포털에서 생성된 커플 코드를 먼저 입력해 주세요."); return; }
    if (!client || !client.isConnected()) return;

    const destination = (cmd === "#CMD:RESET_FACE") ? myName : targetName;
    const pubTopic = `deskpet_2026/${pairCode}/dev_${destination}`;

    const message = new Paho.MQTT.Message(cmd);
    message.destinationName = pubTopic;
    client.send(message);

    let label = "명령 전송";
    if (cmd === "#CMD:HEART") label = "❤️ 하트를 보냈습니다";
    if (cmd === "#CMD:TICKLE") label = "👉 간질이기를 보냈습니다";
    if (cmd === "#CMD:KNOCK") label = "🔔 긴급 호출을 보냈습니다";
    if (cmd === "#CMD:RESET_FACE") label = "🔄 내 표정을 초기화했습니다";

    sentMessages.push({ id: "cmd_" + Date.now(), text: label, read: true, isAction: true });
    saveAndRenderChat();
  }

  function saveAndRenderChat() {
    localStorage.setItem("deskpet_chat_history", JSON.stringify(sentMessages));
    const area = document.getElementById("chatArea");
    area.innerHTML = "";

    sentMessages.forEach(m => {
      const row = document.createElement("div");
      row.className = "msg-row";

      const wrap = document.createElement("div");
      wrap.className = "msg-bubble-wrap";

      if (!m.isAction && !m.read) {
        const badge = document.createElement("span");
        badge.className = "unread-badge";
        badge.innerText = "1";
        wrap.appendChild(badge);
      }

      const bubble = document.createElement("div");
      bubble.className = "msg-bubble" + (m.isAction ? " action" : "");
      bubble.innerText = m.text;
      wrap.appendChild(bubble);

      row.appendChild(wrap);
      area.appendChild(row);
    });

    area.scrollTop = area.scrollHeight;
  }

  function openSettings() {
    document.getElementById("inputPairCode").value = pairCode;
    document.getElementById("inputMyName").value = myName;
    document.getElementById("inputTargetName").value = targetName;
    document.getElementById("settingsModal").style.display = "flex";
  }

  function saveSettings() {
    const newPair   = document.getElementById("inputPairCode").value.trim().toUpperCase();
    const newMy     = document.getElementById("inputMyName").value.trim().toUpperCase();
    const newTarget = document.getElementById("inputTargetName").value.trim().toUpperCase();
    if (!newPair || !newMy || !newTarget) {
      alert("모든 필드를 입력해 주세요.");
      return;
    }

    pairCode   = newPair;
    myName     = newMy;
    targetName = newTarget;

    localStorage.setItem("deskpet_pair_code", pairCode);
    localStorage.setItem("deskpet_my_name", myName);
    localStorage.setItem("deskpet_target_name", targetName);

    document.getElementById("settingsModal").style.display = "none";
    if (client) client.disconnect();
    connectMQTT();
  }

  saveAndRenderChat();
  connectMQTT();
</script>
</body>
</html>
